name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / Tornado ${{ matrix.tornado-name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            tornado-version: "==5.1.1"
            tornado-name: "5.1.1"
          - python-version: "3.9"
            tornado-version: "==6.0.4"
            tornado-name: "6.0.4"
          - python-version: "3.13"
            tornado-version: ">=6,<7"
            tornado-name: "latest 6.x"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: momoko_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d momoko_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MOMOKO_TEST_DB: momoko_test
      MOMOKO_TEST_USER: postgres
      MOMOKO_TEST_PASSWORD: postgres
      MOMOKO_TEST_HOST: 127.0.0.1
      MOMOKO_TEST_PORT: 5432
      MOMOKO_TEST_PROXY_PORT: 15432
      MOMOKO_TEST_HSTORE: 1
      MOMOKO_TEST_JSON: 1
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "tornado${{ matrix.tornado-version }}" psycopg2-binary

      - name: Build tcproxy
        run: make -C tcproxy

      - name: Enable PostgreSQL extensions
        run: psql --dbname="$MOMOKO_TEST_DB" --command="CREATE EXTENSION IF NOT EXISTS hstore"

      - name: Run unit tests
        run: python -m unittest -v tests
